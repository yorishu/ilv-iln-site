# Публикация на GitHub Pages: на сайт попадают ТОЛЬКО файлы страницы
# (PLAN.md, scripts/ и прочее остаются только в репозитории)
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Собрать файлы сайта
        run: |
          mkdir _site
          cp -r index.html css js img music _site/
          rm -f _site/img/.gitkeep _site/music/covers/.gitkeep
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
